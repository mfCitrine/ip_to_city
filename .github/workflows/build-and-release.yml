name: build-and-release

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一凌晨 2 点（UTC）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: scripts/mmdb_from_csv/go.sum

      - name: Add swap (保险，Go 写 mmdb 后内存需求已大降)
        run: |
          set -x
          df -h /
          free -h
          SWAP_SIZE=8G
          AVAIL_KB=$(df -k / | awk 'NR==2 {print $4}')
          NEED_KB=$((8 * 1024 * 1024))
          if [ "$AVAIL_KB" -gt "$((NEED_KB + 2 * 1024 * 1024))" ]; then
            sudo swapoff -a || true
            sudo rm -f /swapfile
            sudo fallocate -l "$SWAP_SIZE" /swapfile || \
              sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            free -h
          else
            echo "磁盘空间不足（可用 $((AVAIL_KB / 1024 / 1024))GB），跳过 swap，依赖默认内存"
          fi

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data sources
        env:
          CZ88_URL: ${{ secrets.CZ88_URL }}
        run: python scripts/download_phase2.py --with-cz88

      - name: Build merged database (CSV)
        env:
          PYTHONUNBUFFERED: 1   # 实时输出日志，便于排查
          IPGEO_SKIP_MMDB: 1    # Python 只出 CSV，mmdb 交给 Go 转换器（防 OOM）
        run: python scripts/build_final.py

      - name: Build mmdb via Go
        run: |
          cd scripts/mmdb_from_csv
          go build -o /tmp/mmdb_from_csv .
          /tmp/mmdb_from_csv ../../data/release/ipgeo-city.csv ../../data/release/ipgeo-city.mmdb
          ls -la ../../data/release/

      - name: Run smoke tests
        run: python scripts/test.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-${{ github.run_id }}
          name: "IP 数据库 ${{ github.run_id }}"
          files: |
            data/release/ipgeo-city.mmdb
            data/release/ipgeo-city.csv
