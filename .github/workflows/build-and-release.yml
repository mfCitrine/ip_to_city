name: build-and-release

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一凌晨 2 点
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install maxminddb geoip2 requests

      - name: Download data sources
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: python scripts/run_pipeline.py --download-only

      - name: Build merged database
        run: python scripts/run_pipeline.py --build-only

      - name: Run smoke tests
        run: python scripts/test.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-${{ github.run_id }}
          name: "IP 数据库 ${{ github.run_id }}"
          files: |
            data/release/ipgeo-city.mmdb
            data/release/ipgeo-asn.mmdb
            data/release/ipgeo-city.csv
