name: build-and-release

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一凌晨 2 点（UTC）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download data sources
        env:
          CZ88_URL: ${{ secrets.CZ88_URL }}
        run: python scripts/download_phase2.py --with-cz88

      - name: Build merged database
        run: python scripts/build_final.py

      - name: Run smoke tests
        run: python scripts/test.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-${{ github.run_id }}
          name: "IP 数据库 ${{ github.run_id }}"
          files: |
            data/release/ipgeo-city.mmdb
            data/release/ipgeo-city.csv
