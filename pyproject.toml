[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipgeo"
version = "0.1.0"
description = "Multi-source merged high-accuracy open-source IP geolocation database"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "maxminddb>=2.5.0",
    "mmdb_writer>=0.2.7",
    "netaddr>=0.9.0",
    "requests>=2.28.0",
    "qqwry-py3>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
